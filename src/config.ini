[run]
report_inputs = data/sample_market_data.txt
compare_inputs = data/synthetic_eurusd_quotes*.txt
report_dir = report

[general]
min_rows = 40
max_memory_budget_gb = 16
memory_overhead_multiplier = 6
grafana_export_dir =

[columns]
timestamp = timestamp
best_bid_1 = best_bid_1, BEST_BID_1, RT_22
best_ask_1 = best_ask_1, BEST_ASK_1, RT_25
best_bid_size_1 = best_bid_size_1
best_ask_size_1 = best_ask_size_1

max_levels = 2

best_bid_level_template = best_bid_{level}
best_ask_level_template = best_ask_{level}
best_bid_size_level_template = best_bid_size_{level}
best_ask_size_level_template = best_ask_size_{level}

[logging]
backup_days = 30

[continuity]
gap_threshold_s = 5.0
top_n_gaps = 10

[returns]
significance_level = 0.05
ljung_box_lags = 10
dt_norm_floor_quantile = 0.05

[outliers]
hampel_window = 31
hampel_threshold = 4.0
replacement_mode = 0

[comparison]
alignment_freq_s = 1.0
max_staleness_s = 5.0
price_diff_threshold_bps = 5.0
top_n_divergences = 10
max_grid_points = 5000000
max_sources = 8
downsample_points_per_day = 1000
downsample_min_rows = 1000000
